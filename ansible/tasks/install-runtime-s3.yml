# install-runtime-s3.yml — install Theia RUNTIME + SERVICES on the rig by pulling
# the .debs from the MinIO runtime plane (s3://theia-runtime/<ver>/). The factory
# runtime install: the rig is provisioned with the version PINNED by runtime_version
# (official tag OR dev rc like 0.2.1-rc1), so the field loop tests non-official
# builds without a GitHub release. The theia-runtime bucket is anonymously
# readable, so the rig pulls over plain HTTP (get_url) — NO aws cli on the device.
#
# AUTHORITATIVE OBJECT LIST = <ver>/index.json. The seeder (ground-station
# seed-official.sh) names the debs by their dpkg-native filename
# (theia-runtime_<ver>_<arch>.deb) and records the exact keys + sha256 in
# index.json. We read it on the rig and pull exactly what it lists — so this task
# never has to reconstruct the filename (version-in-name vs not, etc.) and the
# sha256 is verified end-to-end.
#
# Vars (registry / -e):
#   runtime_version   the <ver> under theia-runtime/<ver>/  (e.g. 0.2.0)
#   s3_endpoint       MinIO URL reachable from the rig (e.g. http://10.0.0.99:9000)
#   s3_runtime_bucket default "theia-runtime"
- name: "Ensure /opt/theia/ipk exists"
  ansible.builtin.file:
    path: "{{ theia_root }}/ipk"
    state: directory
    mode: "0755"

- name: "Fetch the runtime plane index ({{ s3_runtime_bucket | default('theia-runtime') }}/{{ runtime_version }}/index.json)"
  ansible.builtin.uri:
    url: "{{ s3_endpoint }}/{{ s3_runtime_bucket | default('theia-runtime') }}/{{ runtime_version }}/index.json"
    return_content: true
  register: _runtime_index
  delegate_to: localhost      # the CONTROLLER reads the index over its own (internal) path to the S3 plane, so the
  become: false               # sha256 list never travels the rig's network path: a swapped .deb fails its checksum

- name: "Resolve the deb object list from the index"
  ansible.builtin.set_fact:
    _runtime_debs: "{{ (_runtime_index.content | from_json).debs }}"

- name: "Fetch runtime + services .debs (the rig pulls over the gateway's TLS; sha256 from the controller's index)"
  # curl + sha256sum rather than get_url: this ansible's get_url cannot pin a CA file, and Arago has both tools.
  # A wrong hash deletes the file and fails.
  ansible.builtin.shell:
    cmd: >-
      set -e; f="{{ theia_root }}/ipk/{{ item.file | basename }}";
      if [ -f "$f" ] && echo "{{ item.sha256 }}  $f" | sha256sum -c - >/dev/null 2>&1; then echo present; exit 0; fi;
      curl -fsS --retry 3 {{ ('--cacert ' + s3_rig_ca) if (s3_rig_ca | default('') | length > 0) else '' }}
      -o "$f.part" "{{ s3_rig_endpoint | default(s3_endpoint, true) }}/{{ s3_runtime_bucket | default('theia-runtime') }}/{{ item.file }}";
      echo "{{ item.sha256 }}  $f.part" | sha256sum -c - >/dev/null || { rm -f "$f.part"; echo "sha256 mismatch" >&2; exit 1; };
      mv "$f.part" "$f"; echo fetched
  register: _fetch
  changed_when: "'fetched' in _fetch.stdout"
  loop: "{{ _runtime_debs }}"
  loop_control:
    label: "{{ item.file | basename }}"

- name: "Runtime package versions BEFORE (debian rigs)"
  ansible.builtin.command: dpkg-query -W -f='${Package}=${Version}\n' theia-runtime theia-services
  register: _rt_before
  changed_when: false
  failed_when: false
  when: (rig_class | default('debian')) == 'debian'

- name: "Install runtime + services with their dependencies (debian rigs: apt on the local .debs, no upgrades)"
  # apt (not bare dpkg) so the packages' Depends (e.g. libprotobuf32t64 on trixie) are resolved; nothing else
  # on the rig is upgraded (--no-upgrade applies to already-installed packages named on the line: none are).
  ansible.builtin.command:
    cmd: >-
      apt-get install -y --no-install-recommends --allow-downgrades -o Dpkg::Options::=--force-overwrite
      {{ _runtime_debs | map(attribute='file') | map('basename') | map('regex_replace', '^', theia_root + '/ipk/') | join(' ') }}
  environment:
    PATH: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    DEBIAN_FRONTEND: noninteractive
  # --allow-downgrades: the operator picks the runtime version; going back (0.3.1 -> 0.3.0) is a deploy too.
  # changed only when apt really installed/upgraded/downgraded something: the same version again must not
  # restart the running stack.
  register: _dpkg_deb
  changed_when: false          # decided below by comparing the installed versions (apt's summary text varies)
  when: (rig_class | default('debian')) == 'debian'

- name: "Runtime package versions AFTER (debian rigs)"
  ansible.builtin.command: dpkg-query -W -f='${Package}=${Version}\n' theia-runtime theia-services
  register: _rt_after
  changed_when: (_rt_before.stdout | default('')) != _rt_after.stdout
  when: (rig_class | default('debian')) == 'debian'

- name: "Install runtime + services by UNPACKING the packages (opkg rigs: no dpkg; maintainer scripts not run)"
  # A .deb is an ar archive with data.tar.*: Arago has ar + tar. The payload lands under /opt/theia like on a
  # debian rig; what the postinst would do (the theia user, ownership) is done by colony's own tasks after.
  ansible.builtin.shell:
    cmd: >-
      set -e; for d in {{ _runtime_debs | map(attribute='file') | map('basename') | map('regex_replace', '^', theia_root + '/ipk/') | join(' ') }}; do
      t=$(mktemp -d); (cd "$t" && ar x "$d" && tar -xf data.tar.* -C /); rm -rf "$t"; done
  register: _dpkg_opkg
  when: (rig_class | default('debian')) == 'opkg'

# ONE fact for "the runtime binaries changed" (the supervisor restarts on it). Two tasks registering the same
# name was a bug: the SKIPPED one ran last and overwrote the other's result with changed=false, so a real
# upgrade never restarted the stack (live UI test 2026-11-19: 0.3.1 installed, 0.3.0 processes kept running).
- name: "Runtime binaries changed?"
  ansible.builtin.set_fact:
    _runtime_changed: "{{ (_rt_after is defined and _rt_after is changed) or (_dpkg_opkg is defined and _dpkg_opkg is changed) }}"
