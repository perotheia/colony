# rig-class.yml — classify the rig ONCE, so every later task either supports its class or skips it BY NAME.
#   debian  apt + dpkg (BeagleBone AI-64 Debian 13, rpi4, the container rigs): the full path
#   opkg    TI Arago / Yocto images (SK-TDA4VM): base plane only: runtime payload, supervisor unit, TIPC, VPN;
#           NO Mender client (no package for Arago), no apt os_packages, no etcd-server package
# A class a task does not support is reported in `rig_skips` and printed at the end of the play: never a
# silent `failed_when: false` green.
- name: "Detect apt / opkg on the rig"
  ansible.builtin.raw: "if command -v apt-get >/dev/null 2>&1; then echo debian; elif command -v opkg >/dev/null 2>&1; then echo opkg; else echo unknown; fi"
  register: _rc
  changed_when: false

- name: "Set rig_class"
  ansible.builtin.set_fact:
    rig_class: "{{ _rc.stdout | trim }}"
    rig_skips: []

- name: "Refuse an unknown rig class"
  ansible.builtin.assert:
    that: rig_class in ['debian', 'opkg']
    fail_msg: "rig {{ machine }}: neither apt nor opkg found; colony supports debian | opkg rigs"
