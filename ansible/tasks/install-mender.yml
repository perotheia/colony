# install-mender.yml — install the Mender client (the ONE persistent agent on the
# rig; OTA only) + the theia-release custom update module + the Mender→UCM state
# script. == the new agentless analogue of "provisioning installs the convergence
# agent" — except Mender does OTA, NOT general config (that's controller-pushed).
#
# Theia does NOT use Mender's rootfs A/B; the theia-release module lands releases
# as /opt/theia/releases/<ver> + a `current` symlink switch (see deploy/mender/).

# Add the Mender apt repo FIRST. We install the 4.x client (mender-update +
# mender-auth), NOT the legacy mender-client: the server v4.0.1 deployments API
# (server-enrolled OTA) needs the 4.x update/auth split, and `mender-update install`
# is what UCM's standalone path drives. The old mender-client (2.x/3.x) both fails
# on modern artifacts AND *conflicts* with mender-auth at the dpkg level, so it must
# be removed before the 4.x stack installs cleanly.
- name: "Trust the Mender apt signing key"
  ansible.builtin.get_url:
    url: https://downloads.mender.io/repos/debian/gpg
    dest: /etc/apt/trusted.gpg.d/mender.asc
    mode: "0644"
  become: true
  failed_when: false   # offline rig → fall back to the distro package below

- name: "Add the Mender apt repo (device-components: {{ ansible_distribution | lower }}/{{ ansible_distribution_release }})"
  # Mender moved its packages to repos/device-components; the old repos/debian has no trixie (403), which
  # this task used to swallow: the rig then had NO client and the play stayed green.
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ deb_arch | default('arm64') }}] https://downloads.mender.io/repos/device-components {{ ansible_distribution | lower }}/{{ ansible_distribution_release }}/stable main"
    filename: mender
    state: present
    update_cache: true
  become: true

# Retire the legacy mender-client: it conflicts with mender-auth (dpkg "conflicts
# with mender-client"), so leaving it installed makes the 4.x install fail. Purge
# is idempotent (a no-op when absent).
- name: "Remove the legacy mender-client (conflicts with mender-auth 4.x)"
  ansible.builtin.apt:
    name: mender-client
    state: absent
    purge: true
  become: true
  failed_when: false

- name: "Install the Mender client, PINNED (mender-update + mender-auth {{ mender_client_version | default('5.2.0') }})"
  ansible.builtin.apt:
    name:
      - "mender-update={{ mender_client_version | default('5.2.0') }}-1+{{ ansible_distribution | lower }}+{{ ansible_distribution_release }}"
      - "mender-auth={{ mender_client_version | default('5.2.0') }}-1+{{ ansible_distribution | lower }}+{{ ansible_distribution_release }}"
    state: present
    update_cache: true
    install_recommends: false
  register: _mender_apt

- name: "The Mender client is really there"
  ansible.builtin.command: mender-update --version
  changed_when: false

- name: "Ensure the Mender state dirs"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /var/lib/mender
    - /etc/mender

# Identity seed, the theia update modules, the state script and the SWP verify key: the SAME tasks as the opkg
# rigs (install-mender-opkg.yml), so the two classes cannot drift.
- name: "Mender client: the class-agnostic half (identity seed, OTA modules, state script, verify key)"
  ansible.builtin.include_tasks: mender-client-common.yml
