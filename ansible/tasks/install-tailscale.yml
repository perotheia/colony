# install-tailscale.yml — join the rig to the Tailscale VPN. Included by a deploy
# play (or run standalone) for a rig that must be reachable over the tunnel
# (an outdoor Pi reached only over VPN). NM merely OBSERVES the tunnel
# (vpn_observe → VPN_ESTABLISHED); tailscaled OWNS it. The auth key was written
# by com's Provision() to certs/vpn.authkey (rig-enroll), or supplied out-of-band.
#
# Idempotent: skips `tailscale up` when already Running.
#
# Vars:
#   theia_root          /opt/theia
#   vpn_authkey_path    where the per-rig auth key lives
#                       (default /etc/theia/manifest/<machine>/certs/vpn.authkey)
#   tailscale_version   pinned version for the static install (rigs without apt)
- name: "Detect the package manager (apt rigs use the official script; others the static tarball)"
  ansible.builtin.stat:
    path: /usr/bin/apt-get
  register: _ts_apt

- name: "Install tailscale (official apt repo script; once)"
  ansible.builtin.shell:
    cmd: "curl -fsSL https://tailscale.com/install.sh | sh"
    creates: /usr/bin/tailscale
  when: _ts_apt.stat.exists

# Rigs without apt (e.g. TI Arago / Yocto images such as the SK-TDA4VM): install.sh refuses them.
# Install Tailscale's official static arm64/amd64 build, pinned, with its own systemd unit.
- name: "Static tailscale install (non-apt rigs)"
  when: not _ts_apt.stat.exists
  block:
    - name: "Map the CPU to Tailscale's tarball arch"
      ansible.builtin.command: uname -m
      register: _ts_uname
      changed_when: false

    - name: "Download + unpack the pinned static build (once)"
      ansible.builtin.shell:
        cmd: >-
          set -e;
          a={{ {'aarch64': 'arm64', 'x86_64': 'amd64', 'armv7l': 'arm'}[_ts_uname.stdout | trim] }};
          v={{ tailscale_version | default('1.104.4') }};
          d=$(mktemp -d);
          curl -4 -fsSL "https://pkgs.tailscale.com/stable/tailscale_${v}_${a}.tgz" | tar -xz -C "$d";
          install -m 0755 "$d"/tailscale_${v}_${a}/tailscaled /usr/sbin/tailscaled;
          install -m 0755 "$d"/tailscale_${v}_${a}/tailscale /usr/bin/tailscale;
          install -m 0644 "$d"/tailscale_${v}_${a}/systemd/tailscaled.service /etc/systemd/system/tailscaled.service;
          [ -f /etc/default/tailscaled ] || install -m 0644 "$d"/tailscale_${v}_${a}/systemd/tailscaled.defaults /etc/default/tailscaled;
          rm -rf "$d"
        creates: /usr/bin/tailscale

    - name: "Enable + start tailscaled"
      ansible.builtin.systemd:
        name: tailscaled
        enabled: true
        state: started
        daemon_reload: true

# The key arrives as the deployment secret `vpn_authkey` (the GS mints it per rig: single-use, pre-authorised,
# tag:fleet-rig, short-lived) or is already on the rig (com Provision / out-of-band). It is written 0600, used
# through `--auth-key file:` (never on a command line) and removed after the join.
- name: "Directory for the per-rig VPN auth key (0700)"
  ansible.builtin.file:
    path: "{{ (vpn_authkey_path | default('/etc/theia/manifest/' + machine + '/certs/vpn.authkey')) | dirname }}"
    state: directory
    mode: "0700"
  when: vpn_authkey is defined and vpn_authkey | length > 0

- name: "Write the per-rig VPN auth key (deployment secret)"
  ansible.builtin.copy:
    dest: "{{ vpn_authkey_path | default('/etc/theia/manifest/' + machine + '/certs/vpn.authkey') }}"
    content: "{{ vpn_authkey }}"
    mode: "0600"
  no_log: true
  when: vpn_authkey is defined and vpn_authkey | length > 0

- name: "Is a per-rig VPN auth key present? (stat only: the key is never read into a variable)"
  ansible.builtin.stat:
    path: "{{ vpn_authkey_path | default('/etc/theia/manifest/' + machine + '/certs/vpn.authkey') }}"
  register: _authkey

- name: "Query current tailscale backend state (idempotency guard)"
  ansible.builtin.command: "tailscale status --json"
  register: _ts_status
  changed_when: false
  failed_when: false

- name: "Already on the tailnet?"
  ansible.builtin.set_fact:
    _ts_running: "{{ '\"BackendState\": \"Running\"' in (_ts_status.stdout | default('')) or '\"BackendState\":\"Running\"' in (_ts_status.stdout | default('')) }}"

- name: "A join was asked for but there is no key and the rig is not on the tailnet"
  ansible.builtin.assert:
    that: _ts_running or _authkey.stat.exists
    fail_msg: "VPN join requested for {{ inventory_hostname }} but no auth key is on the rig and it is not joined"

- name: "tailscale up (only if not already Running and a key is present)"
  # --accept-routes/--accept-dns=false so the tunnel never shadows the rig's LAN route (the SSH lifeline).
  # hostname = the rig's name (inventory_hostname), not its role. --timeout: never hang the play.
  ansible.builtin.command: >-
    tailscale up
    --auth-key file:{{ vpn_authkey_path | default('/etc/theia/manifest/' + machine + '/certs/vpn.authkey') }}
    --accept-routes=false
    --accept-dns=false
    --timeout 60s
    --hostname {{ inventory_hostname }}
  when:
    - _authkey.stat.exists
    - not _ts_running
  no_log: true

- name: "Tailnet address of the rig (the GS records it as remote_ip)"
  ansible.builtin.command: "tailscale ip -4"
  register: _ts_ip
  changed_when: false
  failed_when: false

- name: "Remove the used auth key (single-use) once the rig is on the tailnet"
  ansible.builtin.file:
    path: "{{ vpn_authkey_path | default('/etc/theia/manifest/' + machine + '/certs/vpn.authkey') }}"
    state: absent
  when: _authkey.stat.exists     # joined, already joined, or failed: a delivered key never stays on the rig

- name: "COLONY_VPN_IP {{ machine }}"
  ansible.builtin.debug:
    msg: "COLONY_VPN_IP {{ machine }} {{ _ts_ip.stdout | default('') | trim }}"
